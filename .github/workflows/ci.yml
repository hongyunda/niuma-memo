name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo, gd, curl, openssl, gmp, bcmath
          tools: composer:v2
      - name: Check public source files
        run: python3 scripts/check-public-tree.py
      - name: Install PHP dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist
      - name: Check Composer metadata and platform
        working-directory: api
        run: |
          composer validate --no-check-publish
          composer check-platform-reqs
      - name: Check PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n 1 php -l
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
