# 牛马备忘录 Nginx 配置
# Docker 部署：直接使用（fastcgi_pass php:9000）
# 宝塔 / 裸机部署：把 fastcgi_pass 换成 unix:/tmp/php-cgi-82.sock 或 unix:/run/php/php8.2-fpm.sock，
#                  根目录改成实际路径，证书路径改成实际路径

server {
    listen 80;
    server_name memo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name memo.example.com;

    # 前端 build 产物已拷入 api/public（index.html、assets/、icons/、sw.js、manifest.webmanifest）
    root /var/www/api/public;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 210m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1k;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ThinkPHP API：全部交给 index.php，PATH_INFO 保留 /api/xxx
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
    }

    # 私有附件：只能由 PHP 通过 X-Accel-Redirect 触发，外部直接访问 404
    location /_protected/ {
        internal;
        alias /var/www/api/storage/uploads/;
    }

    # Service Worker / manifest 不缓存
    location ~* ^/(sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 带 hash 的静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 禁止访问隐藏文件
    location ~ /\. { deny all; }

    # Vue SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
