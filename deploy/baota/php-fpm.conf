[global]
pid = /srv/niuma-memo/shared/runtime/php-fpm.pid
error_log = /srv/niuma-memo/shared/runtime/php-fpm.log
log_level = notice

[niuma-memo]
user = www
group = www
listen = /tmp/php-cgi-niuma-memo.sock
listen.owner = www
listen.group = www
listen.mode = 0660
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 20s
pm.max_requests = 500
request_terminate_timeout = 300s
catch_workers_output = yes
clear_env = yes
php_admin_value[date.timezone] = Asia/Shanghai
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 200M
php_admin_value[post_max_size] = 210M
php_admin_value[max_execution_time] = 240
php_admin_value[user_ini.filename] =
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /srv/niuma-memo/shared/runtime/php-error.log
